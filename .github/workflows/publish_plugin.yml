name: Build and publish RioGIS plugin to public Qgis plugin repo

on:
  release:
    types: published
  workflow_dispatch:
    inputs:
      version:
        description: Plugin version to publish
        required: true
        type: string
    
jobs:
  build:
    runs-on: ${{matrix.os}}
    strategy:
      matrix:
        os: [ubuntu-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

       # Needed if the plugin is using Transifex, to have the lrelease command
       # - name: Install Qt lrelease
       #   run: |
       #    sudo apt-get update
       #    sudo apt-get install qt5-make qttools5-dev-tools

      - name: Install qgis-plugin-ci
        run: pip3 install qgis-plugin-ci

      - name: List current working dir
        run: ls -a
      
      - name: List parent working dir
        run: ls .. -a

      - name: List current WD
        run: ls

      - name: List parent WD
        run: ls ..

      - name: Deploy plugin
        env:
          RELEASE_VERSION: ${{ github.event.release.tag_name || inputs.version }}
        run: >-
          qgis-plugin-ci
          release "$RELEASE_VERSION"
          --github-token ${{ secrets.GITHUB_TOKEN }}
          --osgeo-username ${{ secrets.OSGEO_USER }}
          --osgeo-password ${{ secrets.OSGEO_PASSWORD }}
